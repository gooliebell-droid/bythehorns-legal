<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>By the Horns — Legal</title>
<style>
  :root {
    --indigo: #3A3358;
    --charcoal: #5B5470;
    --orange: #B5713A;
    --orange-deep: #8F5527;
    --paper: #FAF9F7;
    --paper-warm: #EEEAE6;
    --border: #E4DFDA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--indigo);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 24px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { color: var(--charcoal); margin: 0 0 32px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  a.card {
    display: block;
    padding: 16px 18px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--indigo);
    text-decoration: none;
    font-weight: 600;
  }
  a.card:hover { border-color: var(--orange); }
  a.card span {
    display: block;
    font-weight: 400;
    color: var(--charcoal);
    font-size: 13px;
    margin-top: 2px;
  }
</style>
</head>
<body>
<main>
  <h1>By the Horns</h1>
  <p class="sub">Legal &amp; support documents</p>
  <ul>
    <li><a class="card" href="./privacy-policy.html">Privacy Policy<span>How your data is collected and used</span></a></li>
    <li><a class="card" href="./terms-of-service.html">Terms of Service<span>The terms for using the app</span></a></li>
    <li><a class="card" href="./support.html">Support<span>FAQ and how to reach us</span></a></li>
  </ul>
</main>
</body>
</html>
